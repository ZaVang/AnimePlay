<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>动画宅的自我修养 · AnimePlay</title>
    <script>
      // 首屏防闪：在样式生效前把设备缓存的皮肤写到 <html>，避免暗色皮肤用户白屏一闪
      try {
        var s = localStorage.getItem('app-skin');
        if (s) document.documentElement.setAttribute('data-skin', s);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
